<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultas de Disponibilidad - Cancha Sintética</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          >⚽ Cancha Sintética</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reservas.html">Hacer Reserva</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="consultas.html"
                >Consultar Disponibilidad</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-5">
      <h3 class="fw-bold mb-4">🔍 Consultar y Filtrar Reservas</h3>

      <!-- Panel de Filtros -->
      <div class="card shadow-sm mb-4">
        <div class="card-body bg-white rounded">
          <form id="filtroForm" class="row g-3">
            <div class="col-md-4">
              <label for="filtroProfesor" class="form-label font-weight-bold"
                >Buscar por Profesor</label
              >
              <input
                type="text"
                class="form-control"
                id="filtroProfesor"
                placeholder="Nombre del docente..."
              />
            </div>
            <div class="col-md-4">
              <label for="filtroFecha" class="form-label font-weight-bold"
                >Filtrar por Fecha</label
              >
              <input type="date" class="form-control" id="filtroFecha" />
            </div>
            <div class="col-md-4 d-flex align-items-end gap-2">
              <button
                type="button"
                id="btnLimpiarFiltros"
                class="btn btn-outline-secondary w-100"
              >
                Limpiar Filtros
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Resultados -->
      <div class="card shadow-sm">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center"
        >
          <h5 class="card-title mb-0">Resultados de la Búsqueda</h5>
          <span class="badge bg-success" id="totalReservasBadge"
            >0 Reservas</span
          >
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Profesor</th>
                  <th>Curso / Materia</th>
                  <th>Fecha</th>
                  <th>Horario</th>
                  <th>Observaciones</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaConsultas">
                <!-- Se renderizará dinámicamente con JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
