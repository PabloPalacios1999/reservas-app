<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva de Cancha Sintética</title>
    <!-- CSS de Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Estilos propios opcionales -->
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #a5d4be 0%, #e2fcef 100%);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        background: #ffffff;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        width: 100%;
        max-width: 420px;
        padding: 2.5rem;
      }
      .login-title {
        font-weight: 700;
        color: #333;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="login-card">
      <div class="text-center mb-4">
        <i class="bi bi-person-circle text-primary" style="font-size: 3rem"></i>
        <h3 class="login-title mt-2">Bienvenido</h3>
        <p class="text-muted">Inicia sesión para continuar</p>
      </div>

      <!-- Alerta para mensajes de error o éxito -->
      <div id="alertBox" class="alert d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="nombre@ejemplo.com"
              required
            />
          </div>
          <div class="invalid-feedback">
            Por favor ingresa un correo válido.
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="••••••••"
              required
            />
          </div>
          <div class="invalid-feedback">La contraseña es obligatoria.</div>
        </div>

        <div class="d-flex justify-content-between align-items: center mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" />
            <label class="form-check-label" for="rememberMe">Recordarme</label>
          </div>
          <a href="#" class="text-decoration-none small"
            >¿Olvidaste tu contraseña?</a
          >
        </div>

        <button
          type="submit"
          class="btn w-100 py-2"
          style="background-color: #367757; color: #ffffff"
        >
          Ingresar
        </button>
      </form>
    </div>

    <!-- JS de Bootstrap y Script de la App -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
